# LibreLane configuration file
meta:
  version: 3
  flow: Classic
  substituting_steps:
    Checker.LintErrors: null
    #Checker.NetlistAssignStatements: null
    #OpenROAD.ResizerTimingPostCTS: null
    #Checker.HoldViolations: null
    #Checker.SetupViolations: null
    #OpenROAD.Resizer*: null
    #OpenROAD.Repair*: null

ERROR_ON_SYNTH_CHECKS: False

DESIGN_NAME: heichips25_internal
VERILOG_FILES: 
  - dir::../src/heichips25_internal.sv
  - dir::../src/shift_reg.v
  - dir::../src/mux_8x4_to_8.v
  - dir::../src/custom_cells.v
  - dir::../src/dp_mem.v

CELL_LEFS: 
- "/mnt/SSD4TB/IHP_DELAY_LINE/heichips25_block/IHP-Open-PDK/ciel/ihp-sg13g2/versions/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c/ihp-sg13g2/libs.ref/sg13g2_stdcell/lef/sg13g2_stdcell.lef"
- dir::ips/custom_cells/konrads_cells/lef/latch.lef
- dir::ips/custom_cells/konrads_cells/lef/mux.lef
- dir::ips/custom_cells/konrads_cells/lef/mux_inv.lef
- dir::ips/custom_cells/konrads_cells/lef/SwitchMatrixMultiplexer.lef
- dir::ips/custom_cells/konrads_cells/lef/SwitchMatrixMultiplexer_inv.lef

CELL_GDS:
- "/mnt/SSD4TB/IHP_DELAY_LINE/heichips25_block/IHP-Open-PDK/ciel/ihp-sg13g2/versions/c4b8b4e5e7a05f375cca3815d51b3a37721fbf5c/ihp-sg13g2/libs.ref/sg13g2_stdcell/gds/sg13g2_stdcell.gds"
- dir::ips/custom_cells/konrads_cells/gds/latch.gds
- dir::ips/custom_cells/konrads_cells/gds/mux.gds
- dir::ips/custom_cells/konrads_cells/gds/mux_inv.gds
- dir::ips/custom_cells/konrads_cells/gds/SwitchMatrixMultiplexer.gds
- dir::ips/custom_cells/konrads_cells/gds/SwitchMatrixMultiplexer_inv.gds

CLOCK_PORT: clk
CLOCK_PERIOD: 10

PNR_SDC_FILE: dir::constraint.sdc
SIGNOFF_SDC_FILE: dir::constraint.sdc
FALLBACK_SDC: dir::constraint.sdc

VDD_NETS:
- VPWR
GND_NETS:
- VGND

PDN_VERTICAL_LAYER: TopMetal1
PDN_HORIZONTAL_LAYER: Metal5

MACROS:
  multimode_dll:
    gds:
      - dir::ips/multimode_dll/gds/multimode_dll.gds
    lef:
      - dir::ips/multimode_dll/lef/multimode_dll.lef
    nl:
      - dir::ips/multimode_dll/nl/multimode_dll.nl.v
    spef:
      "nom_*":
        - dir::ips/multimode_dll/spef/nom/multimode_dll.nom.spef
    instances: 
      u_multimode_dll:
        location: [40,37]
        orientation: N

  delay_line:
    gds:
      - dir::ips/delay_line/gds/delay_line.gds
    lef:
      - dir::ips/delay_line/lef/delay_line.lef
    nl:
      - dir::ips/delay_line/nl/delay_line.nl.v
    spef:
      "nom_*":
        - dir::ips/delay_line/spef/nom/delay_line.nom.spef
    instances: 
      u_delay_line:
        location: [414,73]
        orientation: N

# IMPORTANT
PDN_MACRO_CONNECTIONS:
  - "u_multimode_dll VDD VSS VPWR VGND"
  - "u_delay_line VDD VSS VPWR VGND"


# Reduce wasted space
TOP_MARGIN_MULT: 1
BOTTOM_MARGIN_MULT: 1
LEFT_MARGIN_MULT: 6
RIGHT_MARGIN_MULT: 6

# Absolute die size
FP_SIZING: absolute

# Small DEF template
DIE_AREA: [0, 0, 500, 200]
FP_DEF_TEMPLATE: dir::def/heichips25_template_small_internal.def

# Large DEF template
#DIE_AREA: [0, 0, 500, 415]
#FP_DEF_TEMPLATE: dir::def/heichips25_template_large.def

# Don't use power rings or TopMetal2 layer
PDN_MULTILAYER: false
RT_MAX_LAYER: TopMetal1

# Enable for better SystemVerilog support
USE_SLANG: true
